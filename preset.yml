name: 科学家模式
description: >-
  通用科研 agent：领域调研（landscape 测绘）、文献检索与精读（lit_* 4 个原生工具：Crossref / arXiv / PubMed / Europe PMC / LibGen）、
  专业推导（sympy 符号推导 + 数值/量纲交叉验证 + LaTeX 成文），以及自研的科研记录链路（study_* 9 个 + record_* 3 个原生工具：
  假设/实验/结论状态机、决策日志、论断与证据绑定、版本化工件与运行溯源、复现指引）。面向数理、物理/工程/材料、AI/计算科学等跨学科研究。
order: 10
