name: publish

# 触发方式：推 v* 标签，或手动运行
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance（可信发布）需要

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    env:
      # 配了 NPM_TOKEN 就用 token；没配则走 npm 可信发布（OIDC）
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 安装 PDF 工具链（pdf_* 测试需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          # 依赖锁在 scripts/requirements-ci.txt：pymupdf 2.x 改了 4llm 的 markdown
          # 输出（标题不再带 `##`），会让 pdf_* 测试变红；本地 Python 3.10 装不到
          # 2.x，所以本地一直是绿的。pymupdf 1.x 不依赖 PyYAML，而 validate.py 需要它。
          python3 -m pip install --quiet --user -r scripts/requirements-ci.txt
          python3 -c "import pymupdf, pymupdf4llm, pdfplumber, yaml; print('python deps ok:', pymupdf.__version__)"
          which pdftotext pdftoppm

      - name: 升级 npm（可信发布 / provenance 需要 npm >= 11.5.2）
        run: npm install -g npm@latest && npm -v

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "package.json=$PKG  tag=$TAG"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::tag ($TAG) 与 package.json ($PKG) 不一致，拒绝发布"
              exit 1
            fi
          else
            echo "手动触发，按 package.json 的 $PKG 发布"
          fi

      - name: 全量校验
        run: npm run check
        env:
          DSH_CHECKOUT: /nonexistent

      - name: 包内容守卫（必须有 bundle 标记与全部技能）
        run: |
          npm pack --pack-destination /tmp >/dev/null
          TGZ=$(ls /tmp/dsh-scientist-*.tgz)
          tar -xzOf "$TGZ" package/package.json > /tmp/pkg.json
          node -e '
            const p = require("/tmp/pkg.json");
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            if (!p.dsh?.bundle?.patch) fail("包内缺少 dsh.bundle.patch");
            if (p.license !== "Apache-2.0") fail("license 应为 Apache-2.0，实际 " + p.license);
            console.log("✓ bundle patch:", p.dsh.bundle.patch, "| license:", p.license, "| version:", p.version);
          '
          EXPECTED=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          SKILLS=$(tar -tzf "$TGZ" | grep -c "^package/skills/[^/]*/SKILL.md$" || true)
          echo "✓ 技能数: $SKILLS（源目录 $EXPECTED）"
          if [ "$SKILLS" -ne "$EXPECTED" ]; then
            echo "::error::包内技能数 ($SKILLS) 与源目录 ($EXPECTED) 不一致"
            exit 1
          fi

      - name: 该版本是否已存在
        id: probe
        run: |
          VER=$(node -p "require('./package.json').version")
          # --prefer-online：绕开 npm 的 packument 缓存，避免把刚发布的版本误判为不存在
          if npm view --prefer-online "dsh-scientist@$VER" version >/dev/null 2>&1; then
            echo "已是 $VER，跳过发布"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 凭据预检（配了 NPM_TOKEN 就先验它有没有效）
        if: env.HAS_TOKEN == 'true'
        run: |
          echo "检查 NPM_TOKEN 是否有效…"
          npm whoami || {
            echo "::error::NPM_TOKEN 无效（401）。请重新生成 granular token："
            echo "::error::  权限 Read and write + Bypass 2FA + 勾选 dsh-scientist 包"
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布（NPM_TOKEN）
        if: steps.probe.outputs.exists != 'true' && env.HAS_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布（npm 可信发布 / OIDC，无需 token）
        if: steps.probe.outputs.exists != 'true' && env.HAS_TOKEN != 'true'
        run: npm publish --provenance --access public

      - name: 发布后验证
        if: steps.probe.outputs.exists != 'true'
        run: |
          VER=$(node -p "require('./package.json').version")
          # 直接查 registry API，绕开 npm 的 packument 缓存：publish 返回后，
          # 同一 job 里的 npm view 可能仍读到旧缓存（latest 还停在上一版），
          # 导致"已发布却报 404"的假失败。
          URL="https://registry.npmjs.org/dsh-scientist/$VER"
          OK=0
          for i in $(seq 1 10); do
            if curl -fsS "$URL" -o /tmp/published.json; then OK=1; break; fi
            echo "registry 尚未同步，等待 6s…（$i/10）"
            sleep 6
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::registry 上仍找不到 dsh-scientist@$VER"
            exit 1
          fi
          node -e '
            const p = require("/tmp/published.json");
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            if (!p.dsh?.bundle?.patch) fail("已发布版本缺少 dsh.bundle.patch");
            if (p.license !== "Apache-2.0") fail("license 应为 Apache-2.0，实际 " + p.license);
            console.log("✓ 已上线:", p.name + "@" + p.version, "| bundle patch:", p.dsh.bundle.patch, "| license:", p.license);
          '
          LATEST=$(curl -fsS https://registry.npmjs.org/dsh-scientist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)["dist-tags"].latest))')
          echo "registry 上的 latest: $LATEST"
